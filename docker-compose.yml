# `docker compose up` with no .env file must produce a working, seeded system.
# Every variable below has a development default supplied inline, so the stack never
# depends on a file the grader does not have. A .env, if present, overrides them.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo}
      POSTGRES_DB: ${POSTGRES_DB:-peblo}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this, so migrations never race an unready database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peblo} -d ${POSTGRES_DB:-peblo}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${DB_PORT:-5432}:5432"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-peblo}:${POSTGRES_PASSWORD:-peblo}@db:5432/${POSTGRES_DB:-peblo}
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-real-secret}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_ROOT: /storage
      SEED_DIR: /data/seed
      SEED_ON_START: ${SEED_ON_START:-true}
      AUTOPUBLISH_ON_SEED: ${AUTOPUBLISH_ON_SEED:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@peblo.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      EDITOR_EMAIL: ${EDITOR_EMAIL:-editor@peblo.test}
      EDITOR_PASSWORD: ${EDITOR_PASSWORD:-editor123}
    volumes:
      # Seed inputs are read-only: the running system must never mutate them.
      - ./data/seed:/data/seed:ro
      - storage_data:/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  cms:
    build:
      context: ./cms
    depends_on:
      api:
        condition: service_started
    ports:
      - "${CMS_PORT:-3000}:80"

  viewer:
    build:
      context: ./viewer
    depends_on:
      api:
        condition: service_started
    ports:
      - "${VIEWER_PORT:-3001}:80"

volumes:
  db_data:
  storage_data:
